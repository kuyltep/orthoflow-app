name: EAS Build

on:
  push:
    branches:
      - main 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Or your preferred Node version

      - name: Install dependencies
        run: npm install # Or yarn install

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build with EAS
        # Choose platform(s) and profile(s)
        # Example: Build for Android and iOS using the 'production' profile
        run: eas build --platform all --profile development --non-interactive
        # Or build specific platforms:
        # run: eas build --platform android --profile production --non-interactive
        # run: eas build --platform ios --profile production --non-interactive
